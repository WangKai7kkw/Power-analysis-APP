name: Test and deploy Shiny app

on:
  push:
    branches: [main]
    paths:
      - "app.R"
      - "R/**"
      - "DESCRIPTION"
      - "renv.lock"
      - "tests/**"
      - "www/**"
      - ".rscignore"
      - ".github/workflows/deploy-shinyapps.yml"
  pull_request:
    paths:
      - "app.R"
      - "R/**"
      - "DESCRIPTION"
      - "renv.lock"
      - "tests/**"
      - "www/**"
      - ".rscignore"
      - ".github/workflows/deploy-shinyapps.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Restore locked R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Run regression tests
        run: Rscript tests/testthat.R

      - name: Run Shiny startup smoke test
        run: Rscript tests/smoke_app.R

      - name: Parse application source
        run: Rscript -e 'invisible(parse(file="app.R")); invisible(parse(file="R/app_helpers.R"))'

  deploy:
    needs: test
    # A tests-only commit may be the fix that makes an earlier app change
    # deployable. Deploy every tested main/workflow_dispatch revision so a
    # recovered pipeline cannot leave shinyapps.io on an older commit.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Restore locked R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e 'rsconnect::setAccountInfo(name=Sys.getenv("SHINYAPPS_ACCOUNT"), token=Sys.getenv("SHINYAPPS_TOKEN"), secret=Sys.getenv("SHINYAPPS_SECRET"))'
          Rscript -e 'rsconnect::deployApp(appDir=".", appName="pwr4exp-app", account=Sys.getenv("SHINYAPPS_ACCOUNT"), forceUpdate=TRUE)'
