name: Deploy Shiny app to shinyapps.io

on:
  push:
    branches: [main]
    paths:
      - "app.R"
      - "DESCRIPTION"
      - "www/**"
      - ".github/workflows/deploy-shinyapps.yml"
  workflow_dispatch:

concurrency:
  group: deploy-shinyapps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages needed by the app
        run: |
          Rscript -e 'install.packages(c("shiny","pwr4exp","dplyr","rhandsontable","bslib","data.table","shinyBS","bsplus","readxl","rsconnect"), repos="https://cloud.r-project.org")'

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e 'rsconnect::setAccountInfo(name=Sys.getenv("SHINYAPPS_ACCOUNT"), token=Sys.getenv("SHINYAPPS_TOKEN"), secret=Sys.getenv("SHINYAPPS_SECRET"))'
          Rscript -e 'rsconnect::deployApp(appDir=".", appName="power_analyses_app", account=Sys.getenv("SHINYAPPS_ACCOUNT"), forceUpdate=TRUE)'
