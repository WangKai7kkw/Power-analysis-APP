name: Test and deploy Shiny app

on:
  push:
    branches: [main]
    paths:
      - "app.R"
      - "R/**"
      - "DESCRIPTION"
      - "renv.lock"
      - "tests/**"
      - "www/**"
      - ".rscignore"
      - ".github/workflows/deploy-shinyapps.yml"
  pull_request:
    paths:
      - "app.R"
      - "R/**"
      - "DESCRIPTION"
      - "renv.lock"
      - "tests/**"
      - "www/**"
      - ".rscignore"
      - ".github/workflows/deploy-shinyapps.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.deployable.outputs.changed }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect deployable application changes
        id: deployable
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" != "push" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
            app.R R DESCRIPTION renv.lock www .rscignore; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Restore locked R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Run regression tests
        run: Rscript tests/testthat.R

      - name: Run Shiny startup smoke test
        run: Rscript tests/smoke_app.R

      - name: Parse application source
        run: Rscript -e 'invisible(parse(file="app.R")); invisible(parse(file="R/app_helpers.R"))'

  deploy:
    needs: [changes, test]
    if: needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Restore locked R dependencies
        uses: r-lib/actions/setup-renv@v2

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e 'rsconnect::setAccountInfo(name=Sys.getenv("SHINYAPPS_ACCOUNT"), token=Sys.getenv("SHINYAPPS_TOKEN"), secret=Sys.getenv("SHINYAPPS_SECRET"))'
          Rscript -e 'rsconnect::deployApp(appDir=".", appName="power_analyses_app", account=Sys.getenv("SHINYAPPS_ACCOUNT"), forceUpdate=TRUE)'
